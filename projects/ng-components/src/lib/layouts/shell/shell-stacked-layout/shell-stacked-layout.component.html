@if (config?.showHeader) {
  <div class="shell-header-container"
    >
    <div [class]="config?.fluid ? 'shell-header-container-inner-fluid' : 'shell-header-container-inner'">
      @if (config?.customHeaderComponent) {
        <div appDynamicComponentHost="Header"></div>
      }
      @if (!config?.customHeaderComponent) {
        <lib-shell-header
          [busy]="busy()"
          [show-userName]="$safeNavigationMigration(config?.showUserNameOnHeader)"
          [show-alerts]="$safeNavigationMigration(config?.showAlertsOnHeader)"
          [show-langs]="$safeNavigationMigration(config?.showLangsOnHeader)">
        </lib-shell-header>
      }
    </div>
  </div>
}
<main [class]="config?.showHeader ? 'shell-content-container' : 'shell-content-container-no-header'">
  <div [class]="config?.fluid ? 'shell-content-container-inner-fluid' : 'shell-content-container-inner'">
    @if ((!config || config.layout === 'Stacked' || !config.layout)) {
      <router-outlet></router-outlet>
    }
  </div>
</main>
@if (config?.showFooter) {
  <div class="shell-footer-container"
    >
    <div [class]="config?.fluid ? 'shell-footer-container-inner-fluid' : 'shell-footer-container-inner'">
      @if (config?.customFooterComponent) {
        <div appDynamicComponentHost
        hostName="Footer"></div>
      }
      @if (!config?.customFooterComponent) {
        <lib-shell-footer></lib-shell-footer>
      }
    </div>
  </div>
}
