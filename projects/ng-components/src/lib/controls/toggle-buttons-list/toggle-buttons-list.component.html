<div class="relative items-center inline-flex">
  @if (icon) {
    <div class="toggle-buttons-list-icon-container">
      <i [class]="icon"></i>
    </div>
  }
  @if (compact) {
    <div class="toggle-buttons-list-drop-down-compact-container">
      <lib-drop-down-menu class="toggle-buttons-list-drop-down" [(selected)]="value" (selectedChange)="selectOption($event)" [options]="options" [placeholder]="dropDownMenuPlaceholder">
      </lib-drop-down-menu>
    </div>
  }
  @if (!compact) {
    <div class="toggle-buttons-list">
      @for (option of options; track option; let i = $index) {
        <!-- [tooltip]="option.description" -->
        <button type="button"
          [disabled]="option.value === value"
          [class.toggle-buttons-list-button-selected]="option.value === value"
          class="toggle-buttons-list-button"
          (click)="selectOption(option.value)">
          @if (option.icon) {
            <div class="toggle-buttons-list-button-icon-container">
              <i [class]="option.icon"></i>
            </div>
          }
          <span class="toggle-buttons-list-button-button-text">{{option.text}}</span>
          @if (option.data && option.data.count) {
            <span
              class="toggle-buttons-list-button-button-count">{{option.data.count}}
            </span>
          }
        </button>
      }
    </div>
  }
</div>
