<div class="relative" (clickOutside)="onClickOutside($event)">
  <button class="langs-button" (click)="menuExpanded = !menuExpanded">
    <i class="text-xs mr-1 ms-Icon ms-Icon--Globe"></i>
    @for (lang of $safeNavigationMigration(langsService?.options) | async; track lang) {
      @if (lang.value === langsService?.selected) {
        <span>{{lang.text}}</span>
      }
    }
  </button>

  <div
    [class]="menuExpanded ? 'langs-menu-expanded':'langs-menu-collapsed'" role="menu" aria-orientation="vertical" aria-labelledby="menu-button" tabindex="-1">
    <div class="py-1" role="none">
      @for (lang of $safeNavigationMigration(langsService?.options) | async; track lang) {
        @if (lang.value != langsService?.selected) {
          <a (click)="selectLang(lang)" class="nav-link-profile" role="menuitem" tabindex="-1" id="menu-item-0">
            <i class="text-xs mr-1 ms-Icon ms-Icon--GlobeFavorite"></i>
            {{lang.description}}
          </a>
        }
      }
    </div>
  </div>
</div>
