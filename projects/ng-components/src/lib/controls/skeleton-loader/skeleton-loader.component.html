@if (type() === 'tiles') {
  <div [class]="deckClass()">
    @for (i of counter(count()); track i) {
      <div class="relative p-4 w-80 bg-white overflow-hidden shadow hover:shadow-md rounded-xl" >
        <div class="animate-pulse flex flex-col rounded-xl">
          <div class="rounded w-full h-32 bg-gray-200"></div>
          <div class="flex flex-col mt-5 rounded-xl">
            <div class="w-full h-5 bg-gray-200 rounded"></div>
            <div class="mt-2 w-10/12 h-3 bg-gray-200 rounded"></div>
            <div class="mt-2 w-8/12 h-3 bg-gray-200 rounded"></div>
          </div>
          <div class="grid grid-cols-2 mt-5 gap-x-2 gap-y-1 rounded-xl">
            <div class="mt-2 w-full h-3 bg-gray-200 rounded"></div>
            <div class="mt-2 w-full h-3 bg-gray-200 rounded"></div>
          </div>
        </div>
      </div>
    }
  </div>
}

@if (type() === 'table') {
  <div class="cards-deck-1" >
    @for (i of counter(count()); track i) {
      <div class="border border-light-blue-300 shadow rounded-lg p-4 max-w-sm w-full mx-auto mb-4">
        <div class="animate-pulse flex space-x-4">
          <div class="rounded-full bg-light-blue-400 h-12 w-12">&nbsp;</div>
          <div class="flex-1 space-y-4 py-1">
            <div class="h-4 bg-light-blue-400 rounded w-3/4">&nbsp;</div>
            <div class="space-y-2">
              <div class="h-4 bg-light-blue-400 rounded">&nbsp;</div>
              <div class="h-4 bg-light-blue-400 rounded w-5/6">&nbsp;</div>
            </div>
          </div>
        </div>
      </div>
    }
  </div>
}
